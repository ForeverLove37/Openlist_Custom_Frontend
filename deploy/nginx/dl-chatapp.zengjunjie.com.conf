limit_req_zone $binary_remote_addr zone=android_api:10m rate=20r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name dl-chatapp.zengjunjie.com;

    ssl_certificate /etc/letsencrypt/live/dl-chatapp.zengjunjie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dl-chatapp.zengjunjie.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 6m;

    location /apk/ {
        alias /var/lib/openlist-drive/android/releases/;
        autoindex off;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /api/releases {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/releases/latest {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/admin/ {
        limit_req zone=android_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8091;
    }

    location / {
        default_type application/json;
        return 200 '{"name":"OpenList Drive Android","latest":"/api/releases/latest"}';
    }
}

server {
    listen 80;
    server_name dl-chatapp.zengjunjie.com;
    return 301 https://$host$request_uri;
}
